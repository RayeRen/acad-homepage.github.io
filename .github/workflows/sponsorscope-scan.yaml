name: SponsorScope daily scan

# Reads every company job board SponsorScope knows, three times a day, and
# publishes the roles that are new to the `sponsorscope-scan` branch. The page
# at /sponsorscope/ reads its "new roles" list from that branch, so nothing is
# committed to main and the site is not rebuilt.

on:
  schedule:
    # 12:17, 17:17 and 22:17 UTC: about 7am, noon and 5pm in New York (an hour later in summer).
    - cron: "17 12,17,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsorscope-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore the previous results
        run: |
          mkdir -p scan-out
          if git fetch --depth=1 origin sponsorscope-scan 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C scan-out
          else
            echo "No earlier results. This is the first run."
          fi

      - name: Scan the job boards
        run: node sponsorscope/scan/daily.js --out scan-out

      - name: Publish the results
        run: |
          cd scan-out
          rm -rf .git
          git init -q -b sponsorscope-scan
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "SponsorScope scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sponsorscope-scan
