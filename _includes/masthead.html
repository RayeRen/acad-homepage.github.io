<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">{{ site.author.name | default: "Homepage" }}</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <i class="fas fa-moon theme-toggle__moon" aria-hidden="true"></i>
        <i class="fas fa-sun theme-toggle__sun" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
