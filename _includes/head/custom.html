<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="manifest" href="images/site.webmanifest">

<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-TileImage" content="images/mstile-144x144.png?v=M44lzPylqQ">
<meta name="msapplication-config" content="images/browserconfig.xml?v=M44lzPylqQ">
<meta name="theme-color" content="#ffffff">

<!-- Use the minified stylesheet; identical rules, ~27% smaller -->
<link rel="stylesheet" href="assets/css/academicons.min.css"/>

<!-- Sharing metadata. No page contains math, so MathJax has been removed. -->
<meta property="og:image" content="{{ site.url }}/images/photo.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ site.url }}/images/photo.jpg">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "url": "{{ site.url }}",
  "email": "mailto:{{ site.author.email }}",
  "jobTitle": "Ph.D. Student",
  "affiliation": {
    "@type": "CollegeOrUniversity",
    "name": "Shanghai Jiao Tong University"
  },
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Shanghai",
    "addressCountry": "CN"
  },
  "sameAs": [
    "{{ site.author.googlescholar }}",
    "{{ site.author.orcid }}"
  ]
}
</script>
