bio: >-
  I am a Research Fellow at the National University of Singapore, working with
  [Tham Yih Chung](https://discovery.nus.edu.sg/16620-yih-chung-tham/publications).
  I earned my Ph.D. in computer science at Sichuan University, co-advised by
  [Xiaojing Shen](https://math.scu.edu.cn/info/1013/5806.htm) and
  [Xuedong Yuan](https://cs.scu.edu.cn/info/1359/17827.htm).
  From September 2022 to September 2023, I was a visiting Ph.D. student at Singapore’s
  Agency for Science, Technology and Research (A*STAR), supervised by
  [Huazhu Fu](https://hzfu.github.io/).
