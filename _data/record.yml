service_summary: >-
  Associate Editor for Pattern Recognition, Guest Editor for IEEE Journal of Biomedical and Health Informatics,
  Frontiers in Medicine, and Frontiers in Radiology, and MICCAI Area Chair in 2025 and 2026.
service: |
  ### Editorial appointments

  - **Associate Editor**, Pattern Recognition.
  - **Guest Editor**, IEEE Journal of Biomedical and Health Informatics, Frontiers in Medicine, and Frontiers in Radiology.

  ### Conference leadership and program committees

  - **Area Chair**, MICCAI 2025 and 2026.
  - **Program Chair**, The 4th International Conference on Machine Vision, Image Processing & Imaging Technology (2026).
  - **Program Committee Member**, BIBM 2025.
  - **Web Chair**, IEEE International Conference on Autonomous and Trusted Computing (2025).

  ### Peer review

  - **Journals** — Nature Biomedical Engineering, Nature Communications, IEEE Transactions on Medical Imaging,
    IEEE Transactions on Neural Networks and Learning Systems, IEEE Transactions on Circuits and Systems for Video Technology,
    IEEE Journal of Biomedical and Health Informatics, IEEE Transactions on Artificial Intelligence, Medical Image Analysis,
    Information Fusion, Pattern Recognition, Knowledge-Based Systems, Expert Systems with Applications,
    Applied Soft Computing, Digital Signal Processing, Engineering Applications of Artificial Intelligence,
    Biomedical Signal Processing and Control, Computer Methods and Programs in Biomedicine, and Artificial Intelligence in Medicine.
  - **Conferences** — ICLR, MICCAI (2023, 2024), ICASSP (2023, 2024), ICIP (2023, 2024),
    MIDL (2023, 2024, 2026), FUSION (2022), and BIBM (2025).
